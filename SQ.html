<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f0c29">
<title>SQ · 资源中转站</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body { height: 100%; }

  body {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: #0b0a1f;
    padding: 24px;
    position: relative;
    overflow-x: hidden;
    overscroll-behavior: none;
  }

  /* ===== 背景 ===== */
  .bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background:
      radial-gradient(ellipse 75% 55% at 12% -5%, rgba(108, 92, 231, 0.30), transparent 62%),
      radial-gradient(ellipse 70% 55% at 95% 105%, rgba(0, 180, 216, 0.24), transparent 62%),
      linear-gradient(160deg, #0f0c29 0%, #1a1a3e 45%, #24243e 100%);
  }

  .bg::after {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
      radial-gradient(1.6px 1.6px at 18px 26px, rgba(255,255,255,0.55), transparent),
      radial-gradient(1px 1px at 92px 74px, rgba(162,155,254,0.65), transparent),
      radial-gradient(1.4px 1.4px at 156px 138px, rgba(0,190,225,0.55), transparent),
      radial-gradient(1px 1px at 46px 172px, rgba(255,255,255,0.4), transparent),
      radial-gradient(1.2px 1.2px at 210px 40px, rgba(162,155,254,0.5), transparent),
      radial-gradient(1px 1px at 128px 206px, rgba(255,255,255,0.35), transparent);
    background-size: 250px 250px;
    background-repeat: repeat;
    opacity: 0.85;
    mask-image: radial-gradient(ellipse 75% 75% at 50% 50%, #000 30%, transparent 80%);
    -webkit-mask-image: radial-gradient(ellipse 75% 75% at 50% 50%, #000 30%, transparent 80%);
  }

  /* ===== 开启动画 ===== */
  .splash {
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(ellipse at 50% 50%, #16143a 0%, #0a0918 72%);
    animation: splashOut 0.5s ease 1.6s forwards;
  }

  @keyframes splashOut {
    to { opacity: 0; visibility: hidden; }
  }

  .splash-inner {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .splash-mark {
    position: relative;
    width: 92px;
    height: 92px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .splash-ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 1.5px solid rgba(162, 155, 254, 0.8);
    animation: ringExpand 1.8s cubic-bezier(0.16, 1, 0.3, 1) 0.35s infinite;
    pointer-events: none;
  }
  .splash-ring.r2 {
    animation-delay: 0.95s;
    border-color: rgba(0, 180, 216, 0.7);
  }

  @keyframes ringExpand {
    0%   { transform: scale(1);   opacity: 0.85; }
    100% { transform: scale(2.6); opacity: 0; }
  }

  .splash-logo {
    position: relative;
    z-index: 2;
    width: 92px;
    height: 92px;
    border-radius: 50%;
    background: linear-gradient(135deg, #6c5ce7, #a29bfe 50%, #00b4d8);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    font-weight: 800;
    color: #fff;
    letter-spacing: 1px;
    box-shadow: 0 10px 40px rgba(108, 92, 231, 0.6);
    animation: logoIn 0.65s cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  @keyframes logoIn {
    from { opacity: 0; transform: scale(0.5); }
    to   { opacity: 1; transform: scale(1); }
  }

  .splash-text {
    margin-top: 30px;
    font-size: 10.5px;
    letter-spacing: 6px;
    color: rgba(255, 255, 255, 0.35);
    text-transform: uppercase;
    animation: fadeUp 0.6s ease 0.5s both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .splash-bar {
    width: 128px;
    height: 2px;
    margin-top: 20px;
    border-radius: 3px;
    background: rgba(255, 255, 255, 0.1);
    overflow: hidden;
    animation: fadeUp 0.6s ease 0.55s both;
  }

  .splash-bar::after {
    content: "";
    display: block;
    height: 100%;
    width: 100%;
    border-radius: 3px;
    background: linear-gradient(90deg, #6c5ce7, #a29bfe, #00b4d8);
    transform-origin: left;
    transform: scaleX(0);
    animation: barFill 1.25s cubic-bezier(0.45, 0, 0.2, 1) 0.2s forwards;
  }

  @keyframes barFill {
    to { transform: scaleX(1); }
  }

  /* ===== 主卡片 ===== */
  .station {
    position: relative;
    z-index: 5;
    width: 100%;
    max-width: 468px;
    background: rgba(32, 30, 64, 0.72);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 30px;
    padding: 44px 32px 34px;
    box-shadow:
      0 24px 70px rgba(0, 0, 0, 0.55),
      inset 0 1px 0 rgba(255, 255, 255, 0.08);
    animation: cardIn 0.7s cubic-bezier(0.16, 1, 0.3, 1) 1.6s both;
  }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(28px) scale(0.97); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .station::before {
    content: "";
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 46%;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(162, 155, 254, 0.85), rgba(0, 180, 216, 0.7), transparent);
    border-radius: 2px;
  }

  /* 头部 */
  .header {
    text-align: center;
    margin-bottom: 30px;
  }

  .logo-ring {
    position: relative;
    width: 72px;
    height: 72px;
    margin: 0 auto 18px;
    border-radius: 50%;
    background: linear-gradient(135deg, #6c5ce7, #a29bfe 50%, #00b4d8);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 21px;
    font-weight: 800;
    color: #fff;
    letter-spacing: 0.5px;
    box-shadow: 0 8px 30px rgba(108, 92, 231, 0.5);
  }

  .logo-ring::after {
    content: "";
    position: absolute;
    inset: -6px;
    border-radius: 50%;
    border: 1px solid rgba(162, 155, 254, 0.28);
  }

  .header h1 {
    color: #fff;
    font-size: 27px;
    font-weight: 800;
    letter-spacing: 3px;
    margin-bottom: 9px;
    background: linear-gradient(100deg, #ffffff 10%, #a29bfe 45%, #00b4d8 80%, #ffffff 100%);
    background-size: 220% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: textShine 6s linear infinite;
  }

  @keyframes textShine {
    0%   { background-position: 0% 50%; }
    100% { background-position: 220% 50%; }
  }

  .header .sub {
    display: inline-flex;
    align-items: center;
    color: rgba(255, 255, 255, 0.42);
    font-size: 11.5px;
    letter-spacing: 4px;
    text-transform: uppercase;
    font-weight: 600;
    min-height: 15px;
  }

  .caret {
    display: inline-block;
    width: 2px;
    height: 12px;
    margin-left: 2px;
    background: #a29bfe;
    animation: blink 1s steps(1) infinite;
  }

  @keyframes blink {
    0%, 49% { opacity: 1; }
    50%, 100% { opacity: 0; }
  }

  /* 状态行 */
  .status-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 24px;
    font-size: 11px;
    color: rgba(255, 255, 255, 0.32);
    letter-spacing: 1.2px;
  }

  .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #22e39a;
    box-shadow: 0 0 8px rgba(34, 227, 154, 0.9);
  }

  .sep {
    width: 1px;
    height: 10px;
    background: rgba(255, 255, 255, 0.14);
  }

  /* 链接列表 */
  .link-list {
    display: flex;
    flex-direction: column;
    gap: 13px;
  }

  .link-card {
    position: relative;
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 17px 20px;
    border-radius: 19px;
    text-decoration: none;
    color: #fff;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.08);
    overflow: hidden;
    cursor: pointer;
    transition:
      transform 0.25s cubic-bezier(0.16, 1, 0.3, 1),
      background 0.25s ease,
      border-color 0.25s ease,
      box-shadow 0.25s ease;
    animation: itemIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  .link-card:nth-child(1) { animation-delay: 1.78s; }
  .link-card:nth-child(2) { animation-delay: 1.86s; }
  .link-card:nth-child(3) { animation-delay: 1.94s; }

  @keyframes itemIn {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .link-card::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    opacity: 0;
    transition: opacity 0.3s ease;
    pointer-events: none;
  }

  .link-card:nth-child(1)::before {
    background: radial-gradient(circle at 22% 50%, rgba(59, 130, 246, 0.2), transparent 68%);
  }
  .link-card:nth-child(2)::before {
    background: radial-gradient(circle at 22% 50%, rgba(18, 183, 245, 0.2), transparent 68%);
  }
  .link-card:nth-child(3)::before {
    background: radial-gradient(circle at 22% 50%, rgba(41, 161, 230, 0.2), transparent 68%);
  }

  .link-card:hover::before { opacity: 1; }

  .link-card:hover {
    transform: translateY(-3px);
    background: rgba(255, 255, 255, 0.09);
    border-color: rgba(255, 255, 255, 0.16);
    box-shadow: 0 14px 40px rgba(0, 0, 0, 0.4);
  }

  .link-card:active { transform: translateY(-1px) scale(0.995); }

  .link-card > * { position: relative; z-index: 2; }

  .link-icon {
    width: 46px;
    height: 46px;
    flex-shrink: 0;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .link-icon svg {
    width: 23px;
    height: 23px;
    stroke: #fff;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
  }

  .link-card:hover .link-icon { transform: scale(1.1); }

  .icon-download {
    background: linear-gradient(135deg, #3b82f6, #6366f1);
    box-shadow: 0 5px 16px rgba(59, 130, 246, 0.38);
  }
  .icon-qq {
    background: linear-gradient(135deg, #12b7f5, #0e9bd8);
    box-shadow: 0 5px 16px rgba(18, 183, 245, 0.38);
  }
  .icon-tg {
    background: linear-gradient(135deg, #29a1e6, #1c8ed0);
    box-shadow: 0 5px 16px rgba(41, 161, 230, 0.38);
  }

  .link-text {
    flex: 1;
    min-width: 0;
  }

  .link-text .title {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.6px;
    margin-bottom: 4px;
  }

  .link-text .desc {
    font-size: 11.5px;
    color: rgba(255, 255, 255, 0.4);
    letter-spacing: 0.4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .link-arrow {
    flex-shrink: 0;
    width: 22px;
    height: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: rgba(255, 255, 255, 0.28);
    transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), color 0.25s ease;
  }

  .link-arrow svg {
    width: 17px;
    height: 17px;
    stroke: currentColor;
    stroke-width: 2.2;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
  }

  .link-card:hover .link-arrow {
    transform: translateX(5px);
    color: rgba(255, 255, 255, 0.75);
  }

  .ripple {
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 255, 255, 0.35), rgba(162, 155, 254, 0.12) 55%, transparent 72%);
    transform: scale(0);
    animation: rippleAnim 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    pointer-events: none;
    z-index: 1;
  }

  @keyframes rippleAnim {
    to { transform: scale(1); opacity: 0; }
  }

  .footer {
    margin-top: 28px;
    padding-top: 18px;
    border-top: 1px solid rgba(255, 255, 255, 0.06);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    color: rgba(255, 255, 255, 0.26);
    font-size: 10.5px;
    letter-spacing: 1px;
    flex-wrap: wrap;
  }

  .footer .tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .footer .tag svg {
    width: 12px;
    height: 12px;
    stroke: currentColor;
    stroke-width: 2;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  #clock {
    font-variant-numeric: tabular-nums;
    color: rgba(255, 255, 255, 0.36);
    letter-spacing: 1.6px;
  }

  .sound-toggle {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 100;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(255, 255, 255, 0.07);
    border: 1px solid rgba(255, 255, 255, 0.12);
    cursor: pointer;
    color: rgba(255, 255, 255, 0.55);
    transition: transform 0.25s ease, background 0.25s, color 0.25s;
    animation: fadeUp 0.6s ease 2.1s both;
  }

  .sound-toggle:hover {
    transform: scale(1.08);
    background: rgba(255, 255, 255, 0.13);
    color: #fff;
  }

  .sound-toggle:active { transform: scale(0.94); }

  .sound-toggle svg {
    width: 18px;
    height: 18px;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
  }

  @media (max-width: 430px) {
    body { padding: 18px; }
    .station { padding: 34px 20px 26px; border-radius: 26px; }
    .header h1 { font-size: 23px; letter-spacing: 2.5px; }
    .logo-ring { width: 64px; height: 64px; font-size: 19px; }
    .link-card { padding: 15px 15px; gap: 13px; border-radius: 17px; }
    .link-icon { width: 43px; height: 43px; border-radius: 13px; }
    .link-icon svg { width: 21px; height: 21px; }
    .link-text .title { font-size: 15px; }
    .link-text .desc { font-size: 11px; }
    .splash-logo, .splash-mark { width: 78px; height: 78px; }
    .splash-logo { font-size: 23px; }
    .splash-bar { width: 106px; }
    .sound-toggle { top: 14px; right: 14px; width: 38px; height: 38px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
    .splash { animation: splashOut 0.2s ease 0.35s forwards; }
    .station { animation-delay: 0.35s; }
    .link-card { animation-delay: 0.4s; }
  }
</style>
</head>
<body>

<div class="bg"></div>

<script>
(function () {
  'use strict';

  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var audioCtx = null;
  var soundOn = true;

  function ensureCtx() {
    if (!audioCtx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  function tone(freq, dur, type, vol, delay) {
    if (!soundOn) return;
    var ac = ensureCtx();
    if (!ac) return;
    var t0 = ac.currentTime + (delay || 0);
    var osc = ac.createOscillator();
    var gain = ac.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, t0);
    gain.gain.setValueAtTime(0, t0);
    gain.gain.linearRampToValueAtTime(vol || 0.05, t0 + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(gain);
    gain.connect(ac.destination);
    osc.start(t0);
    osc.stop(t0 + dur + 0.02);
  }

  var soundMap = {
    download: function () { tone(520, 0.1, 'triangle', 0.05, 0); tone(780, 0.13, 'triangle', 0.04, 0.06); },
    qq:       function () { tone(660, 0.09, 'sine', 0.05, 0); tone(990, 0.12, 'sine', 0.04, 0.07); },
    tg:       function () { tone(740, 0.1, 'sine', 0.05, 0); tone(1100, 0.14, 'sine', 0.035, 0.06); },
    ui:       function () { tone(880, 0.05, 'square', 0.022, 0); }
  };

  var soundBtn = document.getElementById('soundToggle');
  var soundIcon = document.getElementById('soundIcon');
  var iconOn = '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>';
  var iconOff = '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line>';

  if (soundBtn) {
    soundBtn.addEventListener('click', function (e) {
      e.stopPropagation();
      soundOn = !soundOn;
      soundIcon.innerHTML = soundOn ? iconOn : iconOff;
      soundBtn.style.color = soundOn ? 'rgba(255,255,255,0.55)' : 'rgba(255,255,255,0.25)';
      if (soundOn) soundMap.ui();
    });
  }

  var cards = document.querySelectorAll('.link-card');

  for (var i = 0; i < cards.length; i++) {
    (function (card) {
      card.addEventListener('click', function (e) {
        if (!reduceMotion) {
          var rect = card.getBoundingClientRect();
          var size = Math.max(rect.width, rect.height) * 2.2;
          var span = document.createElement('span');
          span.className = 'ripple';
          span.style.width = size + 'px';
          span.style.height = size + 'px';
          span.style.left = (e.clientX - rect.left - size / 2) + 'px';
          span.style.top = (e.clientY - rect.top - size / 2) + 'px';
          card.appendChild(span);
          setTimeout(function () {
            if (span.parentNode) span.parentNode.removeChild(span);
          }, 620);
        }

        var s = card.getAttribute('data-sound');
        if (s && soundMap[s]) soundMap[s]();
      });
    })(cards[i]);
  }

  (function typewriter() {
    var el = document.getElementById('typed');
    if (!el) return;
    var text = 'QUICK ACCESS HUB';
    if (reduceMotion) { el.textContent = text; return; }

    var i = 0;
    function step() {
      if (i <= text.length) {
        el.textContent = text.slice(0, i);
        i++;
        setTimeout(step, 60);
      }
    }
    setTimeout(step, 2050);
  })();

  (function clock() {
    var el = document.getElementById('clock');
    if (!el) return;
    function pad(n) { return n < 10 ? '0' + n : '' + n; }
    function tick() {
      var d = new Date();
      el.textContent = pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
    }
    tick();
    setInterval(tick, 1000);
  })();

  (function visits() {
    var el = document.getElementById('visitCount');
    if (!el) return;
    var n = 1;
    try {
      n = parseInt(localStorage.getItem('sq_visits') || '0', 10) + 1;
      if (isNaN(n) || n < 1) n = 1;
      localStorage.setItem('sq_visits', String(n));
    } catch (err) { }
    el.textContent = '第 ' + n + ' 次访问';
  })();

  window.addEventListener('load', function () {
    var delay = reduceMotion ? 900 : 2400;
    setTimeout(function () {
      var el = document.getElementById('splash');
      if (el && el.parentNode) el.parentNode.removeChild(el);
    }, delay);
  });

})();
</script>

</body>
</html>
