<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SQ追锁 · 官方下载</title>
<style>
  :root{
    --pink-main: #ff8fae;
    --pink-light: #ffc2d4;
    --pink-dark: #e05a7a;
    --text-main: #2c2c2c;
    --text-sub: #5a5a5a;
    --glass-bg: rgba(255, 255, 255, 0.7);
    --glass-border: rgba(255, 255, 255, 0.9);
    --qq-color: #12b7f5;
    --tg-color: #2AABEE;
  }

  *{margin:0;padding:0;box-sizing:border-box}
  html,body{min-height:100%}
  body{
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f5f5f5;
    color: var(--text-main);
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 30px 16px;
    position: relative;
    overflow-x: hidden;
  }

  /* ===== 壁纸层 ===== */
  .wallpaper-layer{
    position: fixed;
    inset: 0;
    z-index: 0;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    /* 【重要】把你上传的那张图替换到下面 url('') 里。
       如果是网络图片，直接写链接；如果是本地图片，把图片和本文件放一起，写 url('图片名.jpg') */
    background-image: url('image_download_1791053642006.jpg');
  }

  /* 柔和的白色遮罩，保证文字在图上看得清，同时保留粉嫩感 */
  .wallpaper-overlay{
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background: rgba(255, 255, 255, 0.15);
  }

  .wrap{
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 480px;
  }

  /* 顶部提示条 */
  .top-tip {
    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(10px);
    border-radius: 12px;
    padding: 10px 16px;
    font-size: 12px;
    color: #e05a7a;
    text-align: center;
    margin-bottom: 12px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    border: 1px solid rgba(255,255,255,0.9);
  }

  /* ===== 主卡片 ===== */
  .card{
    background: var(--glass-bg);
    backdrop-filter: blur(25px) saturate(1.4);
    -webkit-backdrop-filter: blur(25px) saturate(1.4);
    border: 1.5px solid var(--glass-border);
    border-radius: 28px;
    box-shadow: 0 15px 40px rgba(255, 143, 174, 0.2), 0 0 0 1px rgba(255,255,255,0.5) inset;
    padding: 40px 28px 32px;
    text-align: center;
    animation: floatIn 1s cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  @keyframes floatIn {
    from { opacity: 0; transform: translateY(20px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* Logo 区 */
  .logo-ring{
    width: 76px;
    height: 76px;
    margin: 0 auto 18px;
    position: relative;
    display: grid;
    place-items: center;
  }
  .logo-ring::before, .logo-ring::after{
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 2px solid rgba(255, 143, 174, 0.35);
  }
  .logo-ring::before { animation: spin 10s linear infinite; border-style: dashed; }
  .logo-ring::after { inset: 8px; border-color: rgba(255, 194, 212, 0.7); animation: spin 6s linear infinite reverse; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .logo-core{
    width: 52px;
    height: 52px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: linear-gradient(135deg, #ffb7c5, #ff8fae, #ff6b9d);
    box-shadow: 0 6px 20px rgba(255, 107, 157, 0.5);
    position: relative;
    z-index: 2;
  }
  .logo-core span {
    font-size: 17px;
    font-weight: 900;
    color: #fff;
    letter-spacing: 0.5px;
  }

  h1{
    font-size: 24px;
    font-weight: 800;
    letter-spacing: -0.5px;
    margin-bottom: 8px;
    color: #333;
  }
  h1 em{
    font-style: normal;
    background: linear-gradient(90deg, #ff6b9d, #ff8fae, #ffb7c5);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .sub{
    color: var(--text-sub);
    font-size: 13px;
    line-height: 1.6;
    margin-bottom: 26px;
  }

  /* ===== 主下载按钮（普通 a 标签，点击直接新窗口打开） ===== */
  .btn-main {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 18px 24px;
    border-radius: 18px;
    border: none;
    font-size: 16px;
    font-weight: 700;
    text-decoration: none;
    cursor: pointer;
    background: linear-gradient(120deg, #ff8fae, #ff6b9d);
    color: #fff;
    box-shadow: 0 8px 25px rgba(255, 107, 157, 0.4);
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    margin-bottom: 12px;
  }
  .btn-main:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 35px rgba(255, 107, 157, 0.6);
  }
  .btn-main:active { transform: translateY(-1px); }
  .btn-main svg { width: 20px; height: 20px; }

  /* 复制链接区 */
  .copy-area {
    font-size: 12px;
    color: #888;
    margin-bottom: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    cursor: pointer;
    transition: color 0.2s;
    padding: 8px;
    border-radius: 8px;
    background: rgba(255,255,255,0.4);
  }
  .copy-area:hover { color: var(--pink-dark); background: rgba(255,255,255,0.8); }
  .copy-area svg { width: 14px; height: 14px; }/* ===== 社交按钮 ===== */
  .social-title {
    font-size: 11px;
    color: #888;
    letter-spacing: 2px;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .social-title::before, .social-title::after {
    content: "";
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,143,174,0.5), transparent);
  }

  .social-btns {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .btn-social {
    background: rgba(255, 255, 255, 0.8);
    border: 1px solid rgba(255, 255, 255, 0.9);
    color: #444;
    font-size: 14px;
    padding: 14px 10px;
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    text-decoration: none;
    font-weight: 600;
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    box-shadow: 0 4px 15px rgba(0,0,0,0.03);
  }
  .btn-social:hover {
    transform: translateY(-3px);
    background: #fff;
    box-shadow: 0 8px 25px rgba(255, 143, 174, 0.3);
  }
  .btn-social:active { transform: translateY(-1px); }
  .btn-social svg { width: 18px; height: 18px; flex-shrink: 0; }
  .btn-social.qq svg { color: var(--qq-color); }
  .btn-social.tg svg { color: var(--tg-color); }

  /* 底部备用 */
  .fallback {
    margin-top: 22px;
    padding-top: 16px;
    border-top: 1px dashed rgba(255, 143, 174, 0.4);
    font-size: 12px;
    color: #999;
  }
  .fallback code {
    display: block;
    margin-top: 6px;
    font-family: monospace;
    font-size: 11px;
    color: #666;
    background: rgba(255, 255, 255, 0.6);
    border: 1px solid rgba(255, 255, 255, 0.9);
    border-radius: 8px;
    padding: 8px 10px;
    word-break: break-all;
    cursor: pointer;
    transition: all 0.2s;
  }
  .fallback code:hover { background: #fff; color: var(--pink-dark); }

  /* ===== Toast ===== */
  .toast {
    position: fixed;
    left: 50%;
    bottom: 40px;
    transform: translate(-50%, 20px);
    background: rgba(44, 44, 44, 0.9);
    color: #fff;
    font-size: 13px;
    padding: 10px 20px;
    border-radius: 999px;
    opacity: 0;
    pointer-events: none;
    transition: all 0.3s;
    z-index: 99;
    backdrop-filter: blur(10px);
    max-width: 88vw;
    text-align: center;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (max-width: 480px) {
    .card { padding: 32px 18px 24px; border-radius: 24px; }
    h1 { font-size: 20px; }
    .sub { font-size: 12px; }
    .btn-main { font-size: 15px; padding: 16px 20px; }
    .btn-social { font-size: 13px; padding: 12px 8px; gap: 6px; }
    .btn-social svg { width: 16px; height: 16px; }
  }
  @media (max-width: 340px) {
    .social-btns { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<!-- 壁纸层 -->
<div class="wallpaper-layer"></div>
<div class="wallpaper-overlay"></div>

<div class="wrap">
  
  <!-- 顶部防拦截提示 -->
  <div class="top-tip">
    ⚠️ 如果点击按钮无反应，请点击右上角「···」选择「在浏览器打开」
  </div>

  <div class="card">

    <div class="logo-ring">
      <div class="logo-core"><span>SQ</span></div>
    </div>

    <h1>SQ追锁 · <em>官方下载</em></h1>
    <p class="sub">
      点击下方按钮前往 UC 网盘获取启动器，<br>
      根据设备选择 Apple 芯片或 Intel 芯片版本。
    </p>

    <!-- UC网盘下载按钮（直接在浏览器打开） -->
    <a class="btn-main"
       href="https://drive.uc.cn/s/87681455bc604?public=1"
       target="_blank" rel="noopener noreferrer">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="7 10 12 15 17 10"/>
        <line x1="12" y1="15" x2="12" y2="3"/>
      </svg>
      前往 UC 网盘下载
    </a>

    <!-- 点击复制链接 -->
    <div class="copy-area" id="copyTip">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
      </svg>
      点此复制 UC 网盘链接
    </div>

    <!-- 社群 -->
    <div class="social-title">加入社群 · 获取支持</div>

    <div class="social-btns">
      <!-- QQ群：点击直接复制群号，因为QQ群没有直接的网页加群链接，只能通过群号搜索 -->
      <a class="btn-social qq" id="qqBtn" href="javascript:void(0)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
          <circle cx="8.5" cy="11.5" r="1" fill="currentColor"/>
          <circle cx="15.5" cy="11.5" r="1" fill="currentColor"/>
        </svg>
        <span>QQ 群</span>
      </a>

      <!-- Telegram频道：直接在浏览器打开链接 -->
      <a class="btn-social tg" 
         href="https://t.me/SQ39nb"
         target="_blank" rel="noopener noreferrer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 2 11 13"/>
          <path d="M22 2l-7 20-4-9-9-4 20-7z"/>
        </svg>
        <span>Telegram</span>
      </a>
    </div>

    <div class="fallback">
      UC 网盘链接（点击复制）
      <code id="copyLink">https://drive.uc.cn/s/87681455bc604?public=1</code>
    </div>

  </div>
</div>

<div class="toast" id="toast">已复制</div>

<script>
  const toast = document.getElementById('toast');
  let timer;

  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(timer);
    timer = setTimeout(() => toast.classList.remove('show'), 2200);
  }

  async function copyText(text){
    try{
      await navigator.clipboard.writeText(text);
    }catch(e){
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
    }
  }

  // 1. 点击复制 UC 链接区域
  const ucUrl = 'https://drive.uc.cn/s/87681455bc604?public=1';
  document.getElementById('copyTip').addEventListener('click', async () => {
    await copyText(ucUrl);
    showToast('UC 网盘链接已复制，去浏览器粘贴打开吧');
  });

  document.getElementById('copyLink').addEventListener('click', async () => {
    await copyText(ucUrl);
    showToast('UC 网盘链接已复制');
  });

  // 2. QQ群：点击复制群号（因为无法直接网页加群）
  const QQ_GROUP = '1095230880';
  document.getElementById('qqBtn').addEventListener('click', async () => {
    await copyText(QQ_GROUP);
    showToast('群号已复制：' + QQ_GROUP + '，请打开 QQ 搜索加入');
  });
</script>
</body>
</html>
